<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the light scheme before Angular boots to avoid a flash (DESIGN §2). The app is
      // dark-first (base = dark); mirrors ThemeStore.resolveInitialTheme: only an explicit
      // 'light' choice opts into light. Anything else stays on the default dark scheme.
      (function () {
        try {
          if (localStorage.getItem('taskflow.theme') === 'light') {
            document.documentElement.classList.add('tf-light');
          }
        } catch (error) {
          /* localStorage unavailable (private mode) — keep the default dark scheme. */
        }
      })();
    </script>
  </head>
  <body>
    <tf-root></tf-root>
  </body>
</html>
