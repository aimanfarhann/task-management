<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the dark scheme before Angular boots to avoid a flash (DESIGN §2). The app is
      // dark-first; mirrors ThemeStore.resolveInitialTheme: only an explicit 'light' choice
      // opts out (light is the token default), everything else gets the .dark class.
      (function () {
        var root = document.documentElement;
        try {
          if (localStorage.getItem('taskflow.theme') !== 'light') {
            root.classList.add('dark');
          }
        } catch (error) {
          root.classList.add('dark'); /* localStorage unavailable — keep default dark */
        }
      })();
    </script>
  </head>
  <body>
    <tf-root></tf-root>
  </body>
</html>
