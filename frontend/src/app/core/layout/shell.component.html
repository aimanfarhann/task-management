<div class="shell">
  <a class="shell__skip-link" href="#main-content">Skip to content</a>
  <header class="shell__toolbar">
    <a routerLink="/dashboard" class="shell__wordmark" aria-label="TaskFlow — dashboard">
      <span class="shell__mark" aria-hidden="true"></span>
      <span class="shell__wordmark-text tf-display">TaskFlow</span>
    </a>
    <span class="shell__spacer"></span>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="themeStore.toggleTheme()"
      [attr.aria-label]="
        themeStore.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
    >
      <ng-icon
        [name]="themeStore.theme() === 'dark' ? 'lucideSun' : 'lucideMoon'"
        size="1.15rem"
        aria-hidden="true"
      />
    </button>
    <button
      hlmBtn
      variant="ghost"
      type="button"
      class="shell__user-button"
      [cdkMenuTriggerFor]="userMenu"
    >
      <ng-icon name="lucideCircleUserRound" size="1.15rem" aria-hidden="true" />
      <span class="shell__user-name">{{ authStore.currentUser()?.displayName }}</span>
    </button>
    <ng-template #userMenu>
      <div class="tf-menu" cdkMenu>
        <button class="tf-menu-item" type="button" cdkMenuItem (cdkMenuItemTriggered)="signOut()">
          <ng-icon name="lucideLogOut" size="1rem" aria-hidden="true" />
          <span>Sign out</span>
        </button>
      </div>
    </ng-template>
  </header>

  <div class="shell__body">
    <nav class="shell__nav" aria-label="Primary">
      <a
        class="shell__nav-link"
        routerLink="/dashboard"
        routerLinkActive="shell__nav-link--active"
        ariaCurrentWhenActive="page"
      >
        <ng-icon name="lucideLayoutDashboard" size="1.375rem" aria-hidden="true" />
        <span class="shell__nav-label">Dashboard</span>
      </a>
      <a
        class="shell__nav-link"
        routerLink="/projects"
        routerLinkActive="shell__nav-link--active"
        ariaCurrentWhenActive="page"
      >
        <ng-icon name="lucideFolder" size="1.375rem" aria-hidden="true" />
        <span class="shell__nav-label">Projects</span>
      </a>
      @if (authStore.currentUser()?.role === 'ADMIN') {
        <a
          class="shell__nav-link"
          routerLink="/admin/users"
          routerLinkActive="shell__nav-link--active"
          ariaCurrentWhenActive="page"
        >
          <ng-icon name="lucideShieldCheck" size="1.375rem" aria-hidden="true" />
          <span class="shell__nav-label">Admin</span>
        </a>
      }
    </nav>
    <main id="main-content" class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<hlm-toaster [theme]="themeStore.theme()" position="bottom-center" />
