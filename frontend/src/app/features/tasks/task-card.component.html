<article class="task-card">
  <div class="task-card__top">
    <button type="button" class="task-card__title" (click)="open.emit()">
      {{ task().title }}
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      class="task-card__menu-button"
      [cdkMenuTriggerFor]="menu"
      aria-label="Task actions"
    >
      <ng-icon name="lucideEllipsisVertical" size="1.15rem" aria-hidden="true" />
    </button>
    <ng-template #menu>
      <div class="tf-menu" cdkMenu>
        <button class="tf-menu-item" type="button" cdkMenuItem (cdkMenuItemTriggered)="open.emit()">
          <ng-icon name="lucideMaximize2" size="1rem" aria-hidden="true" />
          <span>View details</span>
        </button>
        <button class="tf-menu-item" type="button" cdkMenuItem (cdkMenuItemTriggered)="edit.emit()">
          <ng-icon name="lucidePencil" size="1rem" aria-hidden="true" />
          <span>Edit</span>
        </button>
        @for (option of moveOptions(); track option.status) {
          <button
            class="tf-menu-item"
            type="button"
            cdkMenuItem
            (cdkMenuItemTriggered)="moveTo.emit(option.status)"
          >
            <ng-icon [name]="option.icon" size="1rem" aria-hidden="true" />
            <span>Move to {{ option.label }}</span>
          </button>
        }
        <button
          class="tf-menu-item tf-menu-item--danger"
          type="button"
          cdkMenuItem
          (cdkMenuItemTriggered)="remove.emit()"
        >
          <ng-icon name="lucideTrash2" size="1rem" aria-hidden="true" />
          <span>Delete</span>
        </button>
      </div>
    </ng-template>
  </div>

  <div class="task-card__meta">
    <tf-priority-badge [priority]="task().priority" />
    @if (task().dueDate; as dueDate) {
      <span
        class="task-card__due tf-mono"
        [class.task-card__due--overdue]="overdue()"
        [title]="overdue() ? 'Overdue' : null"
      >
        <ng-icon name="lucideCalendar" size="0.9375rem" aria-hidden="true" />
        <span>{{ dueDate | tfDueDate }}</span>
        @if (overdue()) {
          <span class="sr-only">(overdue)</span>
        }
      </span>
    }
  </div>

  <div class="task-card__assignee">
    <ng-icon name="lucideUser" size="0.9375rem" aria-hidden="true" />
    <span>{{ task().assignee?.displayName ?? 'Unassigned' }}</span>
  </div>
</article>
